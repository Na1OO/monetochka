<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Долги Косте</title>
<style>
:root{--fg:#fff;--muted:#cfd3da;--panel:rgba(15,17,22,.72);--cell:rgba(255,255,255,.08);--line:rgba(255,255,255,.18);--out:#ff8a80;--in:#7be0a0;--accent:#ffd54f;--btn:#ffd54f;--btnfg:#1a1a1a;--ov:rgba(0,0,0,.45);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--fg:#15171c;--muted:#4a505c;--panel:rgba(255,255,255,.8);--cell:rgba(255,255,255,.55);--line:rgba(0,0,0,.15);--out:#c62828;--in:#1b7a45;--accent:#8a5a00;--btn:#1a1a1a;--btnfg:#fff;--ov:rgba(255,255,255,.35)}}
:root[data-theme="light"]{--fg:#15171c;--muted:#4a505c;--panel:rgba(255,255,255,.8);--cell:rgba(255,255,255,.55);--line:rgba(0,0,0,.15);--out:#c62828;--in:#1b7a45;--accent:#8a5a00;--btn:#1a1a1a;--btnfg:#fff;--ov:rgba(255,255,255,.35)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--fg);background:#222;min-height:100vh}
#bg{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2}
#ov{position:fixed;inset:0;background:var(--ov);z-index:-1}
main{max-width:920px;margin:0 auto;padding:16px}
.panel{background:var(--panel);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:14px}
h1{margin:0 0 4px;font-size:1.5rem}
.total{font-size:1.1rem}.total b{color:var(--out)}
.who{color:var(--muted);font-size:.9rem;margin-top:4px}
.nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.nav h2{margin:0;font-size:1.2rem;text-transform:capitalize}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--cell);color:var(--fg);border-radius:10px;padding:6px 12px}
button.p{background:var(--btn);color:var(--btnfg);border:0;font-weight:600}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.dow{text-align:center;color:var(--muted);font-size:.8rem}
.cell{min-height:84px;background:var(--cell);border:1px solid var(--line);border-radius:10px;padding:4px;overflow:hidden;cursor:pointer;text-align:left;display:block;color:var(--fg)}
.cell.off{visibility:hidden}.cell.sel{outline:2px solid var(--accent)}.cell.today .n{color:var(--accent);font-weight:700}
.n{font-size:.8rem;color:var(--muted)}
.chip{display:block;font-size:.68rem;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.chip.o{color:var(--out)}.chip.i{color:var(--in)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
input{font:inherit;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--cell);color:var(--fg);min-width:0;flex:1 1 120px}
.item{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line)}
.item:last-child{border:0}
h3{margin:12px 0 4px;font-size:1rem;color:var(--accent)}
.muted{color:var(--muted);font-size:.9rem}
@media(max-width:600px){.cell{min-height:64px}.chip{font-size:.6rem}main{padding:10px}}
</style>
</head>

<div id="ov"></div>
<main>
  <div id="app">
  <section class="panel">
    <h1>💸 Долги Косте</h1>
    <div class="total" id="total"></div>
    <div class="who" id="who"></div>
  </section>
  <section class="panel">
    <div class="nav"><button id="prev">←</button><h2 id="title"></h2><button id="next">→</button></div>
    <div class="grid" id="dows"></div>
    <div class="grid" id="cal" style="margin-top:4px"></div>
  </section>
  <section class="panel" id="day"></section>
  </div>
</main>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {getDatabase,ref,push,update,remove,onValue} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js";

// ВСТАВЬ СЮДА конфиг из Firebase Console → Project settings → Your apps → Web app
const firebaseConfig = {
  apiKey: "AIzaSyBNT6hqwX0lXIgpw_0r8tbL3Uad489mAjI",
  authDomain: "monetochka-fbd20.firebaseapp.com",
  databaseURL: "https://monetochka-fbd20-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "monetochka-fbd20",
  storageBucket: "monetochka-fbd20.firebasestorage.app",
  messagingSenderId: "1081193532542",
  appId: "1:1081193532542:web:eb98b4982e15faed4adc2f",
  measurementId: "G-5NJ8890GYL"
};
const app=initializeApp(firebaseConfig),db=getDatabase(app);
const $=id=>document.getElementById(id);
let debts=[];
const R=id=>ref(db,"debts/"+id);

onValue(ref(db,"debts"),s=>{
  const v=s.val()||{};
  debts=Object.entries(v).map(([id,d])=>({id,returned:null,...d}));
  render();
},e=>{$("total").textContent="Нет доступа к базе: "+e.message});
const iso=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const fmt=n=>Number(n).toLocaleString("ru-RU")+" ₽";
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const today=new Date();let view=new Date(today.getFullYear(),today.getMonth(),1);let sel=iso(today);
$("dows").innerHTML=["Пн","Вт","Ср","Чт","Пт","Сб","Вс"].map(d=>`<div class="dow">${d}</div>`).join("");
$("prev").onclick=()=>{view.setMonth(view.getMonth()-1);render()};
$("next").onclick=()=>{view.setMonth(view.getMonth()+1);render()};

function render(){
  const open=debts.filter(d=>!d.returned);
  const sum=open.reduce((a,d)=>a+d.amount,0);
  $("total").innerHTML=`Сейчас должны: <b>${fmt(sum)}</b>`;
  const by={};open.forEach(d=>by[d.name]=(by[d.name]||0)+d.amount);
  $("who").textContent=Object.keys(by).length?Object.entries(by).map(([n,v])=>`${n}: ${fmt(v)}`).join(" · "):"Все долги возвращены 🎉";
  $("title").textContent=view.toLocaleDateString("ru-RU",{month:"long",year:"numeric"});
  const first=new Date(view.getFullYear(),view.getMonth(),1);
  const lead=(first.getDay()+6)%7;
  const days=new Date(view.getFullYear(),view.getMonth()+1,0).getDate();
  let h="";
  for(let i=0;i<lead;i++)h+=`<div class="cell off"></div>`;
  for(let d=1;d<=days;d++){
    const k=iso(new Date(view.getFullYear(),view.getMonth(),d));
    const chips=debts.filter(x=>x.taken===k).map(x=>`<span class="chip o">−${esc(x.name)} ${x.amount}</span>`)
      .concat(debts.filter(x=>x.returned===k).map(x=>`<span class="chip i">✓${esc(x.name)} ${x.amount}</span>`)).join("");
    h+=`<button class="cell${k===sel?" sel":""}${k===iso(today)?" today":""}" data-k="${k}"><span class="n">${d}</span>${chips}</button>`;
  }
  $("cal").innerHTML=h;
  $("cal").querySelectorAll(".cell[data-k]").forEach(b=>b.onclick=()=>{sel=b.dataset.k;render()});
  renderDay();
}

function renderDay(){
  const dt=new Date(sel+"T00:00:00").toLocaleDateString("ru-RU",{day:"numeric",month:"long",year:"numeric"});
  const taken=debts.filter(d=>d.taken===sel), back=debts.filter(d=>d.returned===sel), open=debts.filter(d=>!d.returned);
  $("day").innerHTML=`<b>${dt}</b>
  <h3>Взяли в долг</h3>
  <div class="row"><input id="nm" placeholder="Имя"><input id="am" type="number" inputmode="decimal" min="0" placeholder="Сумма, ₽"><button class="p" id="add">Записать</button></div>
  ${taken.map(d=>`<div class="item"><span>${esc(d.name)} — ${fmt(d.amount)} ${d.returned?`<span class="muted">(вернул ${new Date(d.returned+"T00:00:00").toLocaleDateString("ru-RU")})</span>`:""}</span><button data-del="${d.id}">Удалить</button></div>`).join("")||`<div class="muted">В этот день никто не брал</div>`}
  <h3>Вернули в этот день</h3>
  ${back.map(d=>`<div class="item"><span>✓ ${esc(d.name)} — ${fmt(d.amount)}</span><button data-undo="${d.id}">Отменить</button></div>`).join("")}
  ${open.map(d=>`<div class="item"><span>${esc(d.name)} — ${fmt(d.amount)} <span class="muted">(с ${new Date(d.taken+"T00:00:00").toLocaleDateString("ru-RU")})</span></span><button class="p" data-ret="${d.id}">Вернул(а)</button></div>`).join("")||(back.length?"":`<div class="muted">Невозвращённых долгов нет</div>`)}`;
  $("add").onclick=()=>{
    const name=$("nm").value.trim(),amount=parseFloat($("am").value);
    if(!name||!(amount>0))return;
    push(ref(db,"debts"),{name:name.slice(0,60),amount,taken:sel});
  };
  const q=a=>$("day").querySelectorAll(`[${a}]`);
  q("data-del").forEach(b=>b.onclick=()=>remove(R(b.dataset.del)));
  q("data-ret").forEach(b=>b.onclick=()=>update(R(b.dataset.ret),{returned:sel}));
  q("data-undo").forEach(b=>b.onclick=()=>update(R(b.dataset.undo),{returned:null}));
}
render();
</script>
</body>
</html>
